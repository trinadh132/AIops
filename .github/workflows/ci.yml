# Tests, static checks and image builds. Runs on pull requests, and is
# called by deploy.yml on pushes to main (so main isn't tested twice).
#
# Actions are pinned to full commit SHAs (tag in the trailing comment):
# a tag can be moved to malicious code, a SHA can't. Dependabot bumps them.

name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.13.5

jobs:
  java:
    name: Java (mvn verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp verify

  python:
    name: Python (unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # matches the agent image
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No OpenRouter key or database here: every external call is stubbed
      # and AWS is in-memory (moto), so these run on any fork.
      - run: python -m unittest -v test_mcp_server test_remediation test_lambda_handler unittes

  terraform:
    name: Terraform (fmt, validate, scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: validate (main stack and bootstrap)
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      # Fails on any HIGH/CRITICAL misconfiguration without a documented
      # `#trivy:ignore` exception next to the resource.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        image: [mock-service, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  plan:
    name: Terraform plan (preview)
    # Pull requests from this repo only (fork PRs get no OIDC token), and
    # only once the AWS side is set up (repository variables present).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != ''
    needs: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role
    env:
      TF_VAR_image_tag: ${{ github.event.pull_request.head.sha }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        working-directory: infra
        env:
          # Via env, not ${{ }} inside the script, so values are never
          # spliced into shell source.
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=ops-agent/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          # -refresh=false / -lock=false: compare the change against
          # recorded state without calling AWS read APIs or taking the lock,
          # which keeps the plan role nearly permissionless. Drift detection
          # happens in the deploy job's full plan.
          terraform plan -input=false -no-color -refresh=false -lock=false | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
